<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAC AUTO AGRO MARACAIBO - SIRB</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; 
            margin: 0; 
            padding: 20px; 
            color: #e0e0e0;
        }
        .form-card { 
            max-width: 560px; 
            margin: auto; 
            background: #1e1e1e; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.6); 
            border: 1px solid #333333;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 25px;
            background-color: #ffffff;
            padding: 15px 10px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo-container img {
            width: 100%;
            height: auto;
            max-height: 110px;
            object-fit: contain;
        }
        .brand-title {
            text-align: center;
            color: #ffffff;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        h2 { 
            color: #ffffff; 
            text-align: center; 
            margin-top: 5px;
            margin-bottom: 5px; 
            font-size: 22px; 
        }
        p.subtitle { 
            text-align: center; 
            color: #a0a0a0; 
            font-size: 13px; 
            margin-bottom: 25px; 
            line-height: 1.4;
        }
        .section-title {
            color: #d32f2f;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 25px;
            margin-bottom: 10px;
            border-bottom: 1px solid #333333;
            padding-bottom: 5px;
        }
        .row {
            display: flex;
            gap: 15px;
        }
        .col {
            flex: 1;
        }
        label { 
            display: block; 
            margin-top: 12px; 
            color: #cccccc; 
            font-weight: 600; 
            font-size: 12px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="text"], input[type="tel"], input[type="email"], select, textarea { 
            width: 100%; 
            padding: 12px; 
            margin-top: 6px; 
            background-color: #2a2a2a;
            border: 1px solid #444444; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 14px; 
            color: #ffffff;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #d32f2f;
        }
        input::placeholder, textarea::placeholder {
            color: #777777;
        }
        select option {
            background-color: #2a2a2a;
            color: #ffffff;
        }
        .checkbox-group {
            margin-top: 15px;
            background: #252525;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333333;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #dddddd;
        }
        .checkbox-item:last-child {
            margin-bottom: 0;
        }
        .checkbox-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #d32f2f;
            cursor: pointer;
        }
        button { 
            width: 100%; 
            background-color: #d32f2f; 
            color: #ffffff; 
            padding: 15px; 
            border: none; 
            border-radius: 6px; 
            font-size: 15px; 
            margin-top: 25px; 
            cursor: pointer; 
            font-weight: bold; 
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.3s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3);
        }
        button:hover { 
            background-color: #b71c1c; 
        }
        button:active {
            transform: scale(0.99);
        }
        .status { 
            text-align: center; 
            margin-top: 15px; 
            font-weight: bold; 
            font-size: 14px;
        }
        .whatsapp-btn {
            display: none;
            margin-top: 15px;
            background-color: #25d366;
            color: #ffffff;
            text-decoration: none;
            text-align: center;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
        }
        .footer-location {
            text-align: center;
            font-size: 11px;
            color: #666666;
            margin-top: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .signature {
            text-align: right;
            font-size: 10px;
            color: #444444;
            margin-top: 15px;
            font-style: italic;
            letter-spacing: 0.5px;
        }
        @media (max-width: 480px) {
            .row { flex-direction: column; gap: 0; }
        }
    </style>
</head>
<body>

<div class="form-card">
    <div class="logo-container">
        <img src="logos.png" alt="Auto Agro de Maracaibo - JAC - BEL" id="logoImg">
    </div>

    <div class="brand-title">JAC AUTO AGRO MARACAIBO</div>

    <h2>SIRB</h2>
    <p class="subtitle">Simposio Internacional de Reproducción y Biotecnología<br><span style="color:#888888; font-size:12px;">Cotización y Registro de Asistentes</span></p>
    
    <form id="sirbForm">
        <div class="section-title">1. Datos Personales y Contacto</div>
        
        <div class="row">
            <div class="col">
                <label for="nombre">Nombre *</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ej: Carlos">
            </div>
            <div class="col">
                <label for="apellido">Apellido *</label>
                <input type="text" id="apellido" name="apellido" required placeholder="Ej: Mendoza">
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label for="telefono">Teléfono / WhatsApp *</label>
                <input type="tel" id="telefono" name="telefono" required placeholder="+58 412 123 4567">
            </div>
            <div class="col">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
            </div>
        </div>

        <label for="institucion">Empresa / Ganadería / Ciudad *</label>
        <input type="text" id="institucion" name="institucion" required placeholder="Ej: Agropecuaria El Tule / Maracaibo">

        <label for="perfil">Perfil Profesional / Ocupación</label>
        <select id="perfil" name="perfil">
            <option value="Productor / Ganadero">Productor / Ganadero</option>
            <option value="Comerciante">Comerciante</option>
            <option value="Médico Veterinario / Zootecnista">Médico Veterinario / Zootecnista</option>
            <option value="Investigador / Docente">Investigador / Docente</option>
            <option value="Estudiante">Estudiante</option>
            <option value="Comercial / Proveedor">Comercial / Proveedor</option>
            <option value="Otro">Otro</option>
        </select>

        <div class="section-title">2. Interés Comercial / Flota JAC</div>

        <label for="interes">Modelo de Interés</label>
        <select id="interes" name="interes">
            <!-- Pick-ups / Utilitarios Livianos -->
            <option value="JAC T9 Aventura 4x4 (Pick-up Carga)">JAC T9 Aventura 4x4 (Pick-up Carga)</option>
            <option value="JAC La Venezolana 2.8L Diésel (Pick-up)">JAC La Venezolana 2.8L Diésel (Pick-up)</option>
            <option value="JAC X100 Ferretero / 1.5 Ton">JAC X100 Ferretero / 1.5 Ton</option>
            <option value="JAC C-3500 4x4 (Utilitario Chasis)">JAC C-3500 4x4 (Utilitario Chasis)</option>
            <!-- Camiones Chasis Livianos y Medianos -->
            <option value="JAC Urban Chasis 3 Ton">JAC Urban Chasis 3 Ton</option>
            <option value="JAC Urban Ferretero 3 Ton">JAC Urban Ferretero 3 Ton</option>
            <option value="JAC Doble Cabina 3 Ton">JAC Doble Cabina 3 Ton</option>
            <option value="JAC HFC1040 3.5 Ton Chasis">JAC HFC1040 3.5 Ton Chasis</option>
            <option value="JAC HFC1071 5 Ton">JAC HFC1071 5 Ton</option>
            <option value="JAC 6T Chasis (6 Toneladas)">JAC 6T Chasis (6 Toneladas)</option>
            <option value="JAC 6T Ferretero (6 Toneladas)">JAC 6T Ferretero (6 Toneladas)</option>
            <!-- Camiones Pesados Ganaderos -->
            <option value="JAC HFC1090 8 Ton (Chasis Largo)">JAC HFC1090 8 Ton (Chasis Largo)</option>
            <option value="JAC Búfalo HFC1131 12 Ton">JAC Búfalo HFC1131 12 Ton</option>
            <option value="JAC Leyenda 340 HP (20 Toneladas)">JAC Leyenda 340 HP (20 Toneladas)</option>
            <option value="JAC Bachaco 400 HP / Chuto HFC4251 (40 Ton)">JAC Bachaco 400 HP / Chuto 40-45 Ton</option>
            <option value="Otro">Otro (Especificar en comentarios)</option>
        </select>

        <div class="checkbox-group">
            <label class="checkbox-item">
                <input type="checkbox" id="financiamiento" name="financiamiento" value="Sí">
                Deseo asesoría sobre planes de financiamiento / crédito.
            </label>
            <label class="checkbox-item">
                <input type="checkbox" id="testdrive" name="testdrive" value="Sí">
                Me interesa solicitar una prueba de manejo (Test Drive).
            </label>
        </div>

        <label for="notas">Requerimientos o Comentarios</label>
        <textarea id="notas" name="notas" rows="3" placeholder="Indica tipo de carrocería ganadera requerida, detalles específicos, etc..."></textarea>

        <button type="submit" id="btnSubmit">Solicitar Cotización / Registro</button>
    </form>

    <div id="status" class="status"></div>
    <a href="https://wa.me/584120000000?text=Hola,%20acabo%20de%20registrarme%20en%20el%20SIRB%20y%20deseo%20atencion%20inmediata." target="_blank" id="whatsappBtn" class="whatsapp-btn">💬 Atención Inmediata por WhatsApp</a>

    <div class="footer-location">Maracaibo • Zulia • Venezuela</div>
    <div class="signature">Desarrollado por AMGG</div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxHNxG6QTFVgswoA0h-oG19k7EfRj41One8M4SCWo0SaU1NHRG8CR6MH-knTnJS2xiTqg/exec'; 
    const form = document.getElementById('sirbForm');
    const statusDiv = document.getElementById('status');
    const btnSubmit = document.getElementById('btnSubmit');
    const whatsappBtn = document.getElementById('whatsappBtn');

    form.addEventListener('submit', e => {
        e.preventDefault();
        btnSubmit.disabled = true;
        statusDiv.style.color = '#a0a0a0';
        statusDiv.textContent = 'Enviando registro...';

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                statusDiv.style.color = '#4caf50';
                statusDiv.textContent = '¡Registro enviado con éxito! Gracias por registrarte.';
                form.reset();
                btnSubmit.disabled = false;
                whatsappBtn.style.display = 'block';
            })
            .catch(error => {
                statusDiv.style.color = '#f44336';
                statusDiv.textContent = 'Error al enviar. Intenta de nuevo.';
                btnSubmit.disabled = false;
            });
    });
</script>

</body>
</html>
